<div  class="max-w-4xl mx-auto py-10 space-y-8"

    x-data="{
        todasCompletas:false,
        progreso:0,

        async guardarYContinuar(){

            await fetch('/datofotos/guardar',{
                method:'POST',
                headers:{
                    'Content-Type':'application/json',
                    'X-CSRF-TOKEN':'{{ csrf_token }}'
                }
            });

            window.location.href='/analysis/menu_analysis';
        },

        check(){

            const items=document.querySelectorAll('[data-foto]');

            const completadas=[...items]
                .filter(i=>i.dataset.valida==='true')
                .length;

            this.progreso=
                (completadas/items.length)*100;

            this.todasCompletas=
                completadas===items.length;
        }
    }"

    x-init="check()"
>

    <div class="text-center">

        <h1 class="text-5xl md:text-6xl lg:text-7xl font-bold tracking-tight text-slate-900">

            Sube tus fotografías

        </h1>

        <p class="mt-16 text-lg text-slate-600 max-w-2xl mx-auto">

            Completa las fotografías solicitadas para continuar con el análisis.

        </p>

    </div>

    <h2 class="text-xl font-bold text-slate-800 text-center">
        Progreso de subida
        <span x-text="progreso"></span>%
    </h2>


    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6 place-items-center">

        {{ collection:photos sort="order" }}

            <a 
                href="{{ url }}"
                data-foto
                data-valida="{{ valida ? 'true':'false' }}"
                @click="setTimeout(()=>check(), 300)"

                class="flex items-center gap-4 p-5 rounded-xl border transition min-h-[140px] w-[70%] md:w-full justify-self-center

                    {{ if valida }}

                        bg-green-600 text-white border-green-600 pointer-events-none opacity-80

                    {{ else }}

                        bg-white text-gray-900 border-gray-300 hover:bg-gray-100

                    {{ /if }}

            ">

                <div class="flex-shrink-0">

                    <svg 
                        xmlns="http://www.w3.org/2000/svg" 
                        fill="none" 
                        viewBox="0 0 24 24" 
                        stroke-width="1.5" 
                        stroke="currentColor" 
                        class="w-20 h-20 md:w-24 md:h-24"
                    >

                        <path 
                            stroke-linecap="round" 
                            stroke-linejoin="round" 
                            d="M15.182 15.182a4.5 4.5 0 0 1-6.364 0M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM9.75 9.75c0 .414-.168.75-.375.75S9 10.164 9 9.75 9.168 9 9.375 9s.375.336.375.75Zm-.375 0h.008v.015h-.008V9.75Zm5.625 0c0 .414-.168.75-.375.75s-.375-.336-.375-.75.168-.75.375-.75.375.336.375.75Zm-.375 0h.008v.015h-.008V9.75Z" 
                        />

                    </svg>

                </div>

                <span class="flex-1 text-xl lg:text-2xl font-bold">
                    {{ title }}
                </span>

            </a>

        {{ /collection:photos }}

    </div>

    <div class="text-center mt-12">

        <button
            class="min-w-[340px] px-4 py-4 rounded-2xl text-2xl md:text-3xl font-bold text-black bg-white border border-gray-300 rounded-lg transition-all duration-200"

            :class="
                todasCompletas
                    ? 'hover:bg-gray-100 cursor-pointer shadow-lg'
                    : 'opacity-50 cursor-not-allowed'
            "

            :disabled="!todasCompletas"

            @click="if(todasCompletas) guardarYContinuar()"
        >

            Continuar

        </button>

    </div>

</div>
