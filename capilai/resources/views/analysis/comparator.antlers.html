<div class="w-full flex flex-col items-center text-center px-4 mt-4">

    <h1 class="text-3xl font-bold mb-6">Comparador de cambios capilares</h1>

    <p class="text-gray-700 max-w-2xl mb-8">
        Selecciona un ángulo y una fecha anterior para comparar tu foto actual
        con análisis pasados.
    </p>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-8 justify-items-center">

        <!-- Ángulo -->
        <div class="flex flex-col w-full max-w-[220px]">
            <label class="text-sm font-semibold text-gray-700 mb-1">Ángulo</label>
            <select id="angleSelect"
                class="px-4 py-2 rounded-lg border border-gray-300 bg-white shadow-sm
                    focus:ring-2 focus:ring-blue-400 focus:border-blue-400
                    transition-all cursor-pointer w-full">
                <option value="foto-frontal">Frontal</option>
                <option value="foto-superior">Superior</option>
                <option value="foto-lateral-izquierda">Lateral izquierda</option>
                <option value="foto-lateral-derecha">Lateral derecha</option>
            </select>
        </div>

        <!-- Fecha -->
        <div class="flex flex-col w-full max-w-[220px]">
            <label class="text-sm font-semibold text-gray-700 mb-1">Fecha</label>
            <select id="compareDate"
                class="px-4 py-2 rounded-lg border border-gray-300 bg-white shadow-sm
                    focus:ring-2 focus:ring-blue-400 focus:border-blue-400
                    transition-all cursor-pointer w-full overflow-y-auto">
            </select>
        </div>

    </div>

    <div class="flex justify-center">
        <div class="flex flex-col w-[220px]">
            <label class="text-sm font-semibold text-gray-700 mb-1">Hora</label>
            <select id="compareHour"
                class="px-4 py-2 rounded-lg border border-gray-300 bg-white shadow-sm
                    focus:ring-2 focus:ring-blue-400 focus:border-blue-400
                    transition-all cursor-pointer w-full overflow-y-auto">
            </select>
        </div>
    </div>

    <div class="w-full flex flex-col items-center mt-4">
        <h2 class="text-xl font-semibold mb-4">Cambios detectados</h2>
    </div>

</div>

<!-- Contenedor de comparación -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4 px-4">

    <!-- Fotos nuevas -->
    <div id="latestPhotos" class="w-full flex justify-center">
        <div class="w-full max-w-[450px]">
            {{ hair_latest_photos }}
        </div>
    </div>

    <!-- Fotos antiguas -->
    <div id="oldPhotos" class="w-full flex justify-center">
        <div class="w-full max-w-[450px]">
            {{ hair_old_photos }}
        </div>
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const angleSelect = document.getElementById("angleSelect");
    const compareDate = document.getElementById("compareDate");
    const compareHour = document.getElementById("compareHour");

    function filtrarPorSlug() {
        const slugSeleccionado = angleSelect.value;
        const fotos = document.querySelectorAll('#oldPhotos [data-slug]');
        const fotosNuevas = document.querySelectorAll('#latestPhotos [data-slug]');

        fotos.forEach(f => f.style.display = "none");
        fotosNuevas.forEach(f => f.style.display = "none");

        fotosNuevas.forEach(f => {
            if (f.getAttribute('data-slug') === slugSeleccionado) {
                f.style.display = "flex";
            }
        });

        const fotosFiltradas = Array.from(fotos)
            .filter(f => f.getAttribute('data-slug') === slugSeleccionado);

        // Obtener fechas únicas
        const fechasUnicas = [...new Set(
            fotosFiltradas.map(f => f.getAttribute('data-fecha'))
        )];

        // Ordenar fechas (más nueva primero)
        fechasUnicas.sort((a, b) => {
            const [dA, mA, yA] = a.split('/').map(Number);
            const [dB, mB, yB] = b.split('/').map(Number);
            return new Date(yB, mB - 1, dB) - new Date(yA, mA - 1, dA);
        });

        compareDate.innerHTML = "";
        fechasUnicas.forEach(fecha => {
            const op = document.createElement("option");
            op.value = fecha;
            op.textContent = fecha;
            compareDate.appendChild(op);
        });

        // Seleccionar la fecha más nueva
        compareDate.value = fechasUnicas[0];

        // Rellenar horas
        rellenarHoras();

        // Mostrar foto correspondiente
        filtrarPorFechaYHora();
    }

    function rellenarHoras() {
        const fechaSeleccionada = compareDate.value;
        const slugSeleccionado = angleSelect.value;

        const fotos = document.querySelectorAll('#oldPhotos [data-slug]');
        const horas = Array.from(fotos)
            .filter(f => f.getAttribute('data-slug') === slugSeleccionado &&
                         f.getAttribute('data-fecha') === fechaSeleccionada)
            .map(f => f.getAttribute('data-hora'));

        // Ordenar horas (más nueva primero)
        horas.sort((a, b) => b.localeCompare(a));

        compareHour.innerHTML = "";
        horas.forEach(h => {
            const op = document.createElement("option");
            op.value = h;
            op.textContent = h;
            compareHour.appendChild(op);
        });

        // Seleccionar la hora más nueva
        compareHour.value = horas[0];
    }

    function filtrarPorFechaYHora() {
        const fecha = compareDate.value;
        const hora = compareHour.value;
        const slug = angleSelect.value;

        const fotos = document.querySelectorAll('#oldPhotos [data-slug]');

        fotos.forEach(f => {
            const fFecha = f.getAttribute('data-fecha');
            const fHora = f.getAttribute('data-hora');
            const fSlug = f.getAttribute('data-slug');

            f.style.display = (fFecha === fecha && fHora === hora && fSlug === slug)
                ? "flex"
                : "none";
        });
    }

    angleSelect.addEventListener("change", filtrarPorSlug);
    compareDate.addEventListener("change", () => {
        rellenarHoras();
        filtrarPorFechaYHora();
    });
    compareHour.addEventListener("change", filtrarPorFechaYHora);

    filtrarPorSlug();
});
</script>
